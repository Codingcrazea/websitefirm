<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <!-- Background -->
  <rect width="1000" height="600" fill="#E0E0E0"/>
  
  <!-- Top Bar -->
  <rect x="0" y="0" width="1000" height="50" fill="#3B5998"/>
  <text x="20" y="32" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="20" fill="#FFF">Legacy CRM 2008 v3.4.1</text>
  <text x="980" y="32" font-family="Arial, sans-serif" font-size="12" fill="#FFF" text-anchor="end">Welcome, Administrator (Logout)</text>
  
  <!-- Left menu -->
  <rect x="10" y="60" width="180" height="520" fill="#F0F0F0" stroke="#999" stroke-width="1"/>
  <g transform="translate(20, 80)">
    <text x="0" y="20" font-family="Arial, sans-serif" font-weight="bold" font-size="13" fill="#000">Main Menu</text>
    <text x="10" y="45" font-family="Arial, sans-serif" font-size="12" fill="blue" decoration="underline">- Customers DB</text>
    <text x="10" y="70" font-family="Arial, sans-serif" font-size="12" fill="blue" decoration="underline">- Input Form</text>
    <text x="10" y="95" font-family="Arial, sans-serif" font-size="12" fill="blue" decoration="underline">- Sales Pipeline</text>
    <text x="10" y="120" font-family="Arial, sans-serif" font-size="12" fill="blue" decoration="underline">- Reports Generator</text>
    <text x="10" y="145" font-family="Arial, sans-serif" font-size="12" fill="blue" decoration="underline">- Org Tree</text>
    <text x="10" y="170" font-family="Arial, sans-serif" font-size="12" fill="blue" decoration="underline">- Admin Setup</text>
    <text x="10" y="195" font-family="Arial, sans-serif" font-size="12" fill="blue" decoration="underline">- Server Audit Logs</text>
  </g>
  
  <!-- Main Panel -->
  <rect x="200" y="60" width="790" height="520" fill="#FFF" stroke="#999" stroke-width="1"/>
  
  <!-- Tab header -->
  <rect x="200" y="60" width="790" height="30" fill="#DDD" stroke="#999" stroke-width="1"/>
  <rect x="210" y="65" width="120" height="25" fill="#FFF" stroke="#999" stroke-width="1"/>
  <text x="270" y="82" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#000" text-anchor="middle">Customer Details</text>
  
  <!-- Warning banner -->
  <rect x="220" y="105" width="750" height="35" fill="#FFC" stroke="#C90" stroke-width="1"/>
  <text x="235" y="127" font-family="Arial, sans-serif" font-weight="bold" font-size="12" fill="#C00">WARNING: Database connection is using basic TCP sockets. Session is unencrypted!</text>
  
  <!-- Details Table -->
  <g transform="translate(220, 160)">
    <text x="0" y="20" font-family="Arial, sans-serif" font-weight="bold" font-size="14" fill="#000">Enter User Record Metadata:</text>
    
    <!-- Table Form Grid -->
    <!-- Column 1 Headers -->
    <rect x="0" y="35" width="140" height="30" fill="#F0F0F0" stroke="#999"/>
    <text x="10" y="54" font-family="Arial, sans-serif" font-size="11" font-weight="bold">First Name (*):</text>
    
    <rect x="140" y="35" width="220" height="30" fill="#FFF" stroke="#999"/>
    <text x="150" y="54" font-family="Arial, sans-serif" font-size="11">John</text>
    
    <!-- Column 2 -->
    <rect x="360" y="35" width="140" height="30" fill="#F0F0F0" stroke="#999"/>
    <text x="370" y="54" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Last Name (*):</text>
    
    <rect x="500" y="35" width="250" height="30" fill="#FFF" stroke="#999"/>
    <text x="510" y="54" font-family="Arial, sans-serif" font-size="11">Doe</text>
    
    <!-- Row 2 -->
    <rect x="0" y="65" width="140" height="30" fill="#F0F0F0" stroke="#999"/>
    <text x="10" y="84" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Role / Level:</text>
    
    <rect x="140" y="65" width="220" height="30" fill="#FFF" stroke="#999"/>
    <text x="150" y="84" font-family="Arial, sans-serif" font-size="11">System Owner</text>
    
    <rect x="360" y="65" width="140" height="30" fill="#F0F0F0" stroke="#999"/>
    <text x="370" y="84" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Tenant ID Number:</text>
    
    <rect x="500" y="65" width="250" height="30" fill="#FFF" stroke="#999"/>
    <text x="510" y="84" font-family="Arial, sans-serif" font-size="11">019283-X</text>
    
    <!-- Row 3 -->
    <rect x="0" y="95" width="140" height="30" fill="#F0F0F0" stroke="#999"/>
    <text x="10" y="114" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Org Department:</text>
    
    <rect x="140" y="95" width="220" height="30" fill="#FFF" stroke="#999"/>
    <text x="150" y="114" font-family="Arial, sans-serif" font-size="11">Global Administration</text>
    
    <rect x="360" y="95" width="140" height="30" fill="#F0F0F0" stroke="#999"/>
    <text x="370" y="114" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Direct Manager:</text>
    
    <rect x="500" y="95" width="250" height="30" fill="#FFF" stroke="#999"/>
    <text x="510" y="114" font-family="Arial, sans-serif" font-size="11">None (Head Subsystem)</text>
  </g>
  
  <!-- Buttons -->
  <g transform="translate(220, 320)">
    <rect x="0" y="0" width="100" height="26" fill="#DDD" stroke="#999" stroke-width="2"/>
    <text x="50" y="17" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#000" text-anchor="middle">SUBMIT</text>
    
    <rect x="110" y="0" width="100" height="26" fill="#DDD" stroke="#999" stroke-width="2"/>
    <text x="160" y="17" font-family="Arial, sans-serif" font-size="12" fill="#000" text-anchor="middle">CLEAR ALL</text>
  </g>
  
  <!-- Cluttered Data Table below -->
  <g transform="translate(220, 370)">
    <text x="0" y="15" font-family="Arial, sans-serif" font-weight="bold" font-size="13" fill="#000">Database Direct Table Output (Raw Query: SELECT * FROM tblUsers):</text>
    <rect x="0" y="25" width="750" height="120" fill="#FFF" stroke="#000" stroke-width="1"/>
    <line x1="0" y1="50" x2="750" y2="50" stroke="#000" stroke-width="1"/>
    <line x1="120" y1="25" x2="120" y2="145" stroke="#000" stroke-width="1"/>
    <line x1="300" y1="25" x2="300" y2="145" stroke="#000" stroke-width="1"/>
    <line x1="450" y1="25" x2="450" y2="145" stroke="#000" stroke-width="1"/>
    
    <!-- Table content -->
    <text x="10" y="42" font-family="Courier, monospace" font-weight="bold" font-size="12">USERID</text>
    <text x="130" y="42" font-family="Courier, monospace" font-weight="bold" font-size="12">EMAIL</text>
    <text x="310" y="42" font-family="Courier, monospace" font-weight="bold" font-size="12">DEPTID</text>
    <text x="460" y="42" font-family="Courier, monospace" font-weight="bold" font-size="12">TENANTID</text>
    
    <!-- Row 1 -->
    <text x="10" y="70" font-family="Courier, monospace" font-size="12">usr_00912</text>
    <text x="130" y="70" font-family="Courier, monospace" font-size="12">john.doe@acme.com</text>
    <text x="310" y="70" font-family="Courier, monospace" font-size="12">dept_admin_01</text>
    <text x="460" y="70" font-family="Courier, monospace" font-size="12">tenant-acme-prod-01</text>
    
    <!-- Row 2 -->
    <text x="10" y="95" font-family="Courier, monospace" font-size="12">usr_01428</text>
    <text x="130" y="95" font-family="Courier, monospace" font-size="12">sarah.meyer@acme.com</text>
    <text x="310" y="95" font-family="Courier, monospace" font-size="12">dept_sales_02</text>
    <text x="460" y="95" font-family="Courier, monospace" font-size="12">tenant-acme-prod-01</text>
    
    <!-- Row 3 -->
    <text x="10" y="120" font-family="Courier, monospace" font-size="12">usr_03189</text>
    <text x="130" y="120" font-family="Courier, monospace" font-size="12">alex.k@acme.com</text>
    <text x="310" y="120" font-family="Courier, monospace" font-size="12">dept_eng_03</text>
    <text x="460" y="120" font-family="Courier, monospace" font-size="12">tenant-acme-prod-01</text>
  </g>
</svg>
