<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1000" height="600" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Sidebar -->
  <rect x="0" y="0" width="220" height="600" rx="16" fill="#1F2937" fill-opacity="0.4"/>
  <line x1="220" y1="0" x2="220" y2="600" stroke="#374151" stroke-opacity="0.5"/>
  
  <!-- Logo -->
  <rect x="24" y="28" width="32" height="32" rx="8" fill="url(#accentGrad)"/>
  <text x="34" y="50" font-family="system-ui, sans-serif" font-weight="bold" font-size="18" fill="#FFF">Ω</text>
  <text x="68" y="50" font-family="system-ui, sans-serif" font-weight="bold" font-size="18" fill="#F3F4F6">AI-CRM</text>
  
  <!-- Sidebar items -->
  <g transform="translate(0, 90)">
    <!-- Dashboard -->
    <rect x="32" y="11" width="16" height="16" rx="4" fill="#4B5563"/>
    <text x="60" y="24" font-family="system-ui, sans-serif" font-size="14" fill="#9CA3AF">Dashboard</text>
    
    <!-- User Settings (Active) -->
    <rect x="12" y="40" width="196" height="38" rx="8" fill="#374151" fill-opacity="0.6"/>
    <rect x="12" y="49" width="4" height="20" rx="2" fill="#6366F1"/>
    <rect x="32" y="51" width="16" height="16" rx="4" fill="#6366F1"/>
    <text x="60" y="64" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#FFF">User Settings</text>
    
    <!-- Organization -->
    <rect x="32" y="91" width="16" height="16" rx="4" fill="#4B5563"/>
    <text x="60" y="104" font-family="system-ui, sans-serif" font-size="14" fill="#9CA3AF">Organization</text>
  </g>

  <!-- Header -->
  <g transform="translate(220, 0)">
    <line x1="0" y1="70" x2="780" y2="70" stroke="#374151" stroke-opacity="0.5"/>
    <text x="40" y="43" font-family="system-ui, sans-serif" font-weight="bold" font-size="20" fill="#F3F4F6">Profile Management</text>
    <rect x="680" y="20" width="80" height="32" rx="6" fill="#EF4444" fill-opacity="0.1" stroke="#EF4444" stroke-opacity="0.2"/>
    <text x="720" y="40" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#EF4444" text-anchor="middle">Log out</text>
  </g>

  <!-- Main Grid Area -->
  <g transform="translate(260, 100)">
    <!-- Main profile editing card -->
    <rect width="450" height="460" rx="12" fill="#1F2937" fill-opacity="0.6" stroke="#374151" stroke-width="1"/>
    <text x="24" y="36" font-family="system-ui, sans-serif" font-weight="bold" font-size="16" fill="#FFF">Edit User Details</text>
    
    <!-- User Avatar & Glow -->
    <circle cx="74" cy="100" r="30" fill="url(#accentGrad)"/>
    <text x="74" y="105" font-family="system-ui, sans-serif" font-weight="bold" font-size="18" fill="#FFF" text-anchor="middle">JD</text>
    <circle cx="94" cy="120" r="8" fill="#10B981" stroke="#111827" stroke-width="2"/>
    
    <text x="120" y="95" font-family="system-ui, sans-serif" font-weight="bold" font-size="16" fill="#FFF">John Doe</text>
    <text x="120" y="115" font-family="system-ui, sans-serif" font-size="12" fill="#9CA3AF">Owner &amp; Administrator Account</text>
    
    <!-- Inputs Grid -->
    <!-- Input 1 -->
    <g transform="translate(24, 160)">
      <text x="0" y="15" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#9CA3AF">FIRST NAME</text>
      <rect x="0" y="24" width="190" height="38" rx="6" fill="#111827" stroke="#374151" stroke-width="1"/>
      <text x="12" y="48" font-family="system-ui, sans-serif" font-size="13" fill="#FFF">John</text>
    </g>
    
    <!-- Input 2 -->
    <g transform="translate(234, 160)">
      <text x="0" y="15" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#9CA3AF">LAST NAME</text>
      <rect x="0" y="24" width="190" height="38" rx="6" fill="#111827" stroke="#374151" stroke-width="1"/>
      <text x="12" y="48" font-family="system-ui, sans-serif" font-size="13" fill="#FFF">Doe</text>
    </g>
    
    <!-- Input 3 -->
    <g transform="translate(24, 240)">
      <text x="0" y="15" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#9CA3AF">ROLE / LEVEL</text>
      <rect x="0" y="24" width="190" height="38" rx="6" fill="#1F2937" stroke="#374151" stroke-width="1"/>
      <text x="12" y="48" font-family="system-ui, sans-serif" font-size="13" fill="#9CA3AF">System Owner</text>
      <!-- Lock icon to indicate read only -->
      <circle cx="170" cy="43" r="5" fill="none" stroke="#9CA3AF" stroke-width="1.5"/>
    </g>
    
    <!-- Input 4 -->
    <g transform="translate(234, 240)">
      <text x="0" y="15" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#9CA3AF">TENANT ID NUMBER</text>
      <rect x="0" y="24" width="190" height="38" rx="6" fill="#1F2937" stroke="#374151" stroke-width="1"/>
      <text x="12" y="48" font-family="system-ui, sans-serif" font-size="13" fill="#9CA3AF">tenant-acme-prod-01</text>
    </g>
    
    <!-- Input 5 -->
    <g transform="translate(24, 320)">
      <text x="0" y="15" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#9CA3AF">ORG DEPARTMENT</text>
      <rect x="0" y="24" width="400" height="38" rx="6" fill="#111827" stroke="#374151" stroke-width="1"/>
      <text x="12" y="48" font-family="system-ui, sans-serif" font-size="13" fill="#FFF">Global Administration</text>
    </g>
    
    <!-- Submit Buttons -->
    <g transform="translate(24, 400)">
      <rect x="0" y="0" width="160" height="36" rx="6" fill="url(#accentGrad)"/>
      <text x="80" y="22" font-family="system-ui, sans-serif" font-weight="bold" font-size="13" fill="#FFF" text-anchor="middle">Save Profile Settings</text>
    </g>
    
    <!-- Right side: Sidebar of info inside main grid -->
    <g transform="translate(470, 0)">
      <rect width="230" height="460" rx="12" fill="#1F2937" fill-opacity="0.6" stroke="#374151" stroke-width="1"/>
      <text x="16" y="32" font-family="system-ui, sans-serif" font-weight="bold" font-size="14" fill="#FFF">Security Settings</text>
      
      <!-- Safe indicator -->
      <g transform="translate(16, 50)">
        <rect width="198" height="60" rx="8" fill="#10B981" fill-opacity="0.1" stroke="#10B981" stroke-opacity="0.2"/>
        <circle cx="28" cy="30" r="12" fill="#10B981" fill-opacity="0.2"/>
        <text x="28" y="34" font-family="system-ui, sans-serif" font-weight="bold" font-size="12" fill="#10B981" text-anchor="middle">✓</text>
        <text x="50" y="26" font-family="system-ui, sans-serif" font-weight="bold" font-size="11" fill="#FFF">SSL Connection</text>
        <text x="50" y="40" font-family="system-ui, sans-serif" font-size="9" fill="#9CA3AF">All data is AES-256 encrypted</text>
      </g>
      
      <!-- Session List -->
      <text x="16" y="145" font-family="system-ui, sans-serif" font-weight="bold" font-size="11" fill="#9CA3AF">ACTIVE LOGGED SESSIONS</text>
      
      <g transform="translate(16, 160)">
        <text x="0" y="16" font-family="system-ui, sans-serif" font-weight="bold" font-size="12" fill="#FFF">Chrome - Windows OS</text>
        <text x="0" y="30" font-family="system-ui, sans-serif" font-size="10" fill="#9CA3AF">IP: 192.168.1.104 • Active now</text>
        <line x1="0" y1="42" x2="198" y2="42" stroke="#374151" stroke-opacity="0.3"/>
      </g>
      
      <g transform="translate(16, 215)">
        <text x="0" y="16" font-family="system-ui, sans-serif" font-weight="bold" font-size="12" fill="#FFF">Safari - macOS (iPhone)</text>
        <text x="0" y="30" font-family="system-ui, sans-serif" font-size="10" fill="#9CA3AF">IP: 73.12.92.11 • 2 hours ago</text>
        <line x1="0" y1="42" x2="198" y2="42" stroke="#374151" stroke-opacity="0.3"/>
      </g>
    </g>
  </g>
</svg>
