<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="800" height="450" fill="#0f172a"/>
  <!-- Multi-channel breakdown & profit comparison chart -->
  <rect x="20" y="20" width="760" height="410" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="40" y="55" font-family="system-ui" font-size="16" font-weight="bold" fill="#ffffff">Multi-Channel Profit vs Revenue Analysis</text>
  
  <!-- Left Bar Chart -->
  <rect x="40" y="80" width="350" height="320" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="60" y="110" font-family="system-ui" font-size="13" font-weight="bold" fill="#ffffff">Revenue vs COGS per Product</text>
  
  <rect x="60" y="140" width="180" height="24" rx="4" fill="#95BF47"/>
  <rect x="60" y="170" width="110" height="24" rx="4" fill="#059669"/>
  <text x="250" y="156" font-family="system-ui" font-size="11" fill="#cbd5e1">Shopify Premium Tee</text>

  <rect x="60" y="210" width="230" height="24" rx="4" fill="#FF9900"/>
  <rect x="60" y="240" width="160" height="24" rx="4" fill="#059669"/>
  <text x="300" y="226" font-family="system-ui" font-size="11" fill="#cbd5e1">Amazon Hoodie</text>

  <!-- Right Donut Chart -->
  <rect x="410" y="80" width="330" height="320" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="430" y="110" font-family="system-ui" font-size="13" font-weight="bold" fill="#ffffff">Channel Margin Split</text>
  <circle cx="575" cy="220" r="70" fill="none" stroke="#95BF47" stroke-width="26" stroke-dasharray="180 260"/>
  <circle cx="575" cy="220" r="70" fill="none" stroke="#FF9900" stroke-width="26" stroke-dasharray="120 320" stroke-dashoffset="-180"/>
</svg>
