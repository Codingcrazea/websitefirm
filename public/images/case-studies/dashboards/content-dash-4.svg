<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="800" height="450" fill="#0f172a"/>
  <!-- Performance Analytics & Logged Engagement Stats -->
  <rect x="20" y="20" width="760" height="410" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="40" y="55" font-family="system-ui" font-size="16" font-weight="bold" fill="#ffffff">📊 Logged Performance Analytics &amp; Engagement Dashboard</text>

  <!-- Metric Cards Row -->
  <rect x="40" y="80" width="160" height="70" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="55" y="102" font-family="system-ui" font-size="10" fill="#94a3b8">Total Engagements</text>
  <text x="55" y="130" font-family="system-ui" font-size="18" font-weight="bold" fill="#c084fc">14,280</text>

  <rect x="220" y="80" width="160" height="70" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="235" y="102" font-family="system-ui" font-size="10" fill="#94a3b8">Best Platform</text>
  <text x="235" y="130" font-family="system-ui" font-size="18" font-weight="bold" fill="#38bdf8">LinkedIn</text>

  <rect x="400" y="80" width="160" height="70" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="415" y="102" font-family="system-ui" font-size="10" fill="#94a3b8">Best Content Type</text>
  <text x="415" y="130" font-family="system-ui" font-size="18" font-weight="bold" fill="#7C3AED">Social Post</text>

  <rect x="580" y="80" width="160" height="70" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="595" y="102" font-family="system-ui" font-size="10" fill="#94a3b8">Best Post Time</text>
  <text x="595" y="130" font-family="system-ui" font-size="18" font-weight="bold" fill="#10b981">Tue 10:00 AM</text>

  <!-- Engagement Chart -->
  <rect x="40" y="165" width="700" height="235" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="60" y="195" font-family="system-ui" font-size="12" font-weight="bold" fill="#ffffff">Engagement Velocity Over Time (Recharts)</text>
  <path d="M 60 360 Q 200 240, 340 280 T 520 200 T 700 230" fill="none" stroke="#7C3AED" stroke-width="3"/>
  <circle cx="520" cy="200" r="5" fill="#7C3AED" stroke="#ffffff" stroke-width="2"/>
</svg>
