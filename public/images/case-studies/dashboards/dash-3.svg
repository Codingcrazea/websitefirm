<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1000" height="600" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Title -->
  <text x="40" y="50" font-family="system-ui, sans-serif" font-weight="bold" font-size="22" fill="#F3F4F6">Organizational Hierarchy &amp; Reporting Lines</text>
  <text x="40" y="75" font-family="system-ui, sans-serif" font-size="14" fill="#9CA3AF">Multi-tenant role hierarchies, custom designations, departments, and manager-subordinate mapping.</text>
  
  <!-- Top Node (CEO / Owner) -->
  <g transform="translate(500, 110)">
    <rect x="-100" y="0" width="200" height="70" rx="10" fill="#1F2937" stroke="#6366F1" stroke-width="2"/>
    <circle cx="-60" cy="35" r="20" fill="url(#accentGrad)"/>
    <text x="-60" y="39" font-family="system-ui, sans-serif" font-weight="bold" font-size="11" fill="#FFF" text-anchor="middle">JD</text>
    <text x="-30" y="30" font-family="system-ui, sans-serif" font-weight="bold" font-size="13" fill="#FFF">John Doe</text>
    <text x="-30" y="46" font-family="system-ui, sans-serif" font-size="10" fill="#10B981">Owner (Tenant Admin)</text>
  </g>
  
  <!-- Level 1 Connections -->
  <line x1="500" y1="180" x2="500" y2="230" stroke="#374151" stroke-width="2"/>
  <line x1="280" y1="230" x2="720" y2="230" stroke="#374151" stroke-width="2"/>
  
  <!-- Vertical branches down from Level 1 horizontal line -->
  <line x1="280" y1="230" x2="280" y2="270" stroke="#374151" stroke-width="2"/>
  <line x1="720" y1="230" x2="720" y2="270" stroke="#374151" stroke-width="2"/>
  
  <!-- Mid Nodes -->
  <!-- Left Mid Node (Head of Sales) -->
  <g transform="translate(280, 270)">
    <rect x="-90" y="0" width="180" height="60" rx="8" fill="#1F2937" stroke="#374151"/>
    <circle cx="-55" cy="30" r="16" fill="#3B82F6"/>
    <text x="-55" y="33" font-family="system-ui, sans-serif" font-weight="bold" font-size="10" fill="#FFF" text-anchor="middle">SM</text>
    <text x="-30" y="26" font-family="system-ui, sans-serif" font-weight="bold" font-size="12" fill="#FFF">Sarah Meyer</text>
    <text x="-30" y="42" font-family="system-ui, sans-serif" font-size="9" fill="#9CA3AF">VP of Sales</text>
  </g>
  
  <!-- Right Mid Node (CTO / Engineering Lead) -->
  <g transform="translate(720, 270)">
    <rect x="-90" y="0" width="180" height="60" rx="8" fill="#1F2937" stroke="#374151"/>
    <circle cx="-55" cy="30" r="16" fill="#10B981"/>
    <text x="-55" y="33" font-family="system-ui, sans-serif" font-weight="bold" font-size="10" fill="#FFF" text-anchor="middle">AK</text>
    <text x="-30" y="26" font-family="system-ui, sans-serif" font-weight="bold" font-size="12" fill="#FFF">Alex Kowalski</text>
    <text x="-30" y="42" font-family="system-ui, sans-serif" font-size="9" fill="#9CA3AF">Tech Lead</text>
  </g>
  
  <!-- Level 2 Connections -->
  <!-- Left Side branches -->
  <line x1="280" y1="330" x2="280" y2="370" stroke="#374151" stroke-width="2"/>
  <line x1="170" y1="370" x2="390" y2="370" stroke="#374151" stroke-width="2"/>
  <line x1="170" y1="370" x2="170" y2="400" stroke="#374151" stroke-width="2"/>
  <line x1="390" y1="370" x2="390" y2="400" stroke="#374151" stroke-width="2"/>
  
  <!-- Right Side branches -->
  <line x1="720" y1="330" x2="720" y2="370" stroke="#374151" stroke-width="2"/>
  <line x1="610" y1="370" x2="830" y2="370" stroke="#374151" stroke-width="2"/>
  <line x1="610" y1="370" x2="610" y2="400" stroke="#374151" stroke-width="2"/>
  <line x1="830" y1="370" x2="830" y2="400" stroke="#374151" stroke-width="2"/>
  
  <!-- Subordinate Nodes -->
  <!-- Sales Rep 1 -->
  <g transform="translate(170, 400)">
    <rect x="-70" y="0" width="140" height="50" rx="6" fill="#1F2937" stroke="#374151" stroke-opacity="0.6"/>
    <text x="0" y="20" font-family="system-ui, sans-serif" font-weight="bold" font-size="10" fill="#FFF" text-anchor="middle">David Lin</text>
    <text x="0" y="35" font-family="system-ui, sans-serif" font-size="8" fill="#9CA3AF" text-anchor="middle">Sales Executive</text>
  </g>
  
  <!-- Sales Rep 2 -->
  <g transform="translate(390, 400)">
    <rect x="-70" y="0" width="140" height="50" rx="6" fill="#1F2937" stroke="#374151" stroke-opacity="0.6"/>
    <text x="0" y="20" font-family="system-ui, sans-serif" font-weight="bold" font-size="10" fill="#FFF" text-anchor="middle">Emma Watson</text>
    <text x="0" y="35" font-family="system-ui, sans-serif" font-size="8" fill="#9CA3AF" text-anchor="middle">Sales Executive</text>
  </g>
  
  <!-- Developer 1 -->
  <g transform="translate(610, 400)">
    <rect x="-70" y="0" width="140" height="50" rx="6" fill="#1F2937" stroke="#374151" stroke-opacity="0.6"/>
    <text x="0" y="20" font-family="system-ui, sans-serif" font-weight="bold" font-size="10" fill="#FFF" text-anchor="middle">Ryan Gosling</text>
    <text x="0" y="35" font-family="system-ui, sans-serif" font-size="8" fill="#9CA3AF" text-anchor="middle">API Developer</text>
  </g>
  
  <!-- Developer 2 -->
  <g transform="translate(830, 400)">
    <rect x="-70" y="0" width="140" height="50" rx="6" fill="#1F2937" stroke="#374151" stroke-opacity="0.6"/>
    <text x="0" y="20" font-family="system-ui, sans-serif" font-weight="bold" font-size="10" fill="#FFF" text-anchor="middle">Scarlett J.</text>
    <text x="0" y="35" font-family="system-ui, sans-serif" font-size="8" fill="#9CA3AF" text-anchor="middle">Frontend Dev</text>
  </g>
</svg>
