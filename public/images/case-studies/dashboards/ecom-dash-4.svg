<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="800" height="450" fill="#0f172a"/>
  <!-- Flexible CSV Import Wizard Mockup -->
  <rect x="20" y="20" width="760" height="410" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="40" y="55" font-family="system-ui" font-size="16" font-weight="bold" fill="#ffffff">CSV Order Import Wizard (Step 2 of 4: Column Mapping)</text>

  <!-- Progress Bar -->
  <rect x="40" y="75" width="700" height="6" rx="3" fill="#0f172a"/>
  <rect x="40" y="75" width="350" height="6" rx="3" fill="#10b981"/>

  <!-- Mapping Card Container -->
  <rect x="40" y="100" width="700" height="300" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="60" y="130" font-family="system-ui" font-size="12" font-weight="bold" fill="#10b981">DETECTED CSV HEADER</text>
  <text x="420" y="130" font-family="system-ui" font-size="12" font-weight="bold" fill="#10b981">SYSTEM TARGET FIELD</text>

  <!-- Field 1 -->
  <rect x="60" y="145" width="320" height="36" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="75" y="168" font-family="monospace" font-size="11" fill="#cbd5e1">"Created At Date"</text>
  <text x="390" y="168" font-family="system-ui" font-size="14" fill="#94a3b8">➔</text>
  <rect x="420" y="145" width="300" height="36" rx="6" fill="#1e293b" stroke="#10b981"/>
  <text x="435" y="168" font-family="system-ui" font-size="11" fill="#ffffff">order_date (Date &amp; Time)</text>

  <!-- Field 2 -->
  <rect x="60" y="195" width="320" height="36" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="75" y="218" font-family="monospace" font-size="11" fill="#cbd5e1">"Total Amount Paid ($)"</text>
  <text x="390" y="218" font-family="system-ui" font-size="14" fill="#94a3b8">➔</text>
  <rect x="420" y="195" width="300" height="36" rx="6" fill="#1e293b" stroke="#10b981"/>
  <text x="435" y="218" font-family="system-ui" font-size="11" fill="#ffffff">total_amount (Numeric)</text>

  <!-- Field 3 -->
  <rect x="60" y="245" width="320" height="36" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="75" y="268" font-family="monospace" font-size="11" fill="#cbd5e1">"Sales Source / Channel"</text>
  <text x="390" y="268" font-family="system-ui" font-size="14" fill="#94a3b8">➔</text>
  <rect x="420" y="245" width="300" height="36" rx="6" fill="#1e293b" stroke="#10b981"/>
  <text x="435" y="268" font-family="system-ui" font-size="11" fill="#ffffff">channel_name (Category Tag)</text>

  <!-- Bottom CTA Button -->
  <rect x="540" y="340" width="180" height="40" rx="8" fill="#10b981"/>
  <text x="630" y="365" font-family="system-ui" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Confirm &amp; Preview (247 Rows) ➔</text>
</svg>
