<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1000" height="600" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Title -->
  <text x="40" y="50" font-family="system-ui, sans-serif" font-weight="bold" font-size="22" fill="#F3F4F6">AI-CRM Analytics Dashboard</text>
  <text x="40" y="75" font-family="system-ui, sans-serif" font-size="14" fill="#9CA3AF">Detailed breakdowns, conversion pipelines, and attribution channels.</text>
  
  <!-- Grid layout -->
  <!-- Left Side: Lead attribution pie/donut chart -->
  <g transform="translate(40, 110)">
    <rect width="440" height="440" rx="12" fill="#1F2937" fill-opacity="0.6" stroke="#374151" stroke-width="1"/>
    <text x="24" y="36" font-family="system-ui, sans-serif" font-weight="bold" font-size="16" fill="#FFF">Lead Sources Breakdown</text>
    
    <!-- Donut Chart -->
    <circle cx="220" cy="220" r="120" fill="none" stroke="#374151" stroke-width="40" stroke-opacity="0.5"/>
    
    <!-- Stripe 1 (Referral - 40%) -->
    <circle cx="220" cy="220" r="120" fill="none" stroke="#6366F1" stroke-width="40" stroke-dasharray="301.59 753.98" stroke-dashoffset="0" transform="rotate(-90 220 220)"/>
    <!-- Stripe 2 (LinkedIn - 25%) -->
    <circle cx="220" cy="220" r="120" fill="none" stroke="#10B981" stroke-width="40" stroke-dasharray="188.49 753.98" stroke-dashoffset="-301.59" transform="rotate(-90 220 220)"/>
    <!-- Stripe 3 (Organic - 20%) -->
    <circle cx="220" cy="220" r="120" fill="none" stroke="#F59E0B" stroke-width="40" stroke-dasharray="150.79 753.98" stroke-dashoffset="-490.08" transform="rotate(-90 220 220)"/>
    <!-- Stripe 4 (Other - 15%) -->
    <circle cx="220" cy="220" r="120" fill="none" stroke="#EF4444" stroke-width="40" stroke-dasharray="113.1 753.98" stroke-dashoffset="-640.87" transform="rotate(-90 220 220)"/>
    
    <circle cx="220" cy="220" r="85" fill="#111827"/>
    <text x="220" y="215" font-family="system-ui, sans-serif" font-weight="bold" font-size="28" fill="#FFF" text-anchor="middle">4,819</text>
    <text x="220" y="235" font-family="system-ui, sans-serif" font-size="12" fill="#9CA3AF" text-anchor="middle">Total Leads</text>
    
    <!-- Legends -->
    <g transform="translate(40, 390)">
      <circle cx="10" cy="0" r="6" fill="#6366F1"/>
      <text x="24" y="4" font-family="system-ui, sans-serif" font-size="12" fill="#FFF">Referral (40%)</text>
      
      <circle cx="130" cy="0" r="6" fill="#10B981"/>
      <text x="144" y="4" font-family="system-ui, sans-serif" font-size="12" fill="#FFF">LinkedIn (25%)</text>
      
      <circle cx="250" cy="0" r="6" fill="#F59E0B"/>
      <text x="264" y="4" font-family="system-ui, sans-serif" font-size="12" fill="#FFF">Organic (20%)</text>
    </g>
  </g>
  
  <!-- Right Side: Conversion Funnel and Performance Metrics -->
  <g transform="translate(500, 110)">
    <rect width="460" height="440" rx="12" fill="#1F2937" fill-opacity="0.6" stroke="#374151" stroke-width="1"/>
    <text x="24" y="36" font-family="system-ui, sans-serif" font-weight="bold" font-size="16" fill="#FFF">Conversion Funnel Status</text>
    
    <!-- Funnel Bar 1: Visitors -->
    <g transform="translate(24, 70)">
      <text x="0" y="16" font-family="system-ui, sans-serif" font-size="12" fill="#9CA3AF">1. Traffic (10,000)</text>
      <rect x="0" y="24" width="412" height="24" rx="4" fill="#374151"/>
      <rect x="0" y="24" width="412" height="24" rx="4" fill="url(#accentGrad)"/>
      <text x="390" y="40" font-family="system-ui, sans-serif" font-weight="bold" font-size="11" fill="#FFF" text-anchor="end">100%</text>
    </g>
    
    <!-- Funnel Bar 2: Leads Created -->
    <g transform="translate(24, 150)">
      <text x="0" y="16" font-family="system-ui, sans-serif" font-size="12" fill="#9CA3AF">2. Leads Created (4,819)</text>
      <rect x="0" y="24" width="412" height="24" rx="4" fill="#374151"/>
      <rect x="0" y="24" width="198" height="24" rx="4" fill="url(#accentGrad)"/>
      <text x="180" y="40" font-family="system-ui, sans-serif" font-weight="bold" font-size="11" fill="#FFF" text-anchor="end">48.2%</text>
    </g>
    
    <!-- Funnel Bar 3: Qualified Leads -->
    <g transform="translate(24, 230)">
      <text x="0" y="16" font-family="system-ui, sans-serif" font-size="12" fill="#9CA3AF">3. Marketing Qualified (2,120)</text>
      <rect x="0" y="24" width="412" height="24" rx="4" fill="#374151"/>
      <rect x="0" y="24" width="87" height="24" rx="4" fill="url(#accentGrad)"/>
      <text x="75" y="40" font-family="system-ui, sans-serif" font-weight="bold" font-size="11" fill="#FFF" text-anchor="end">21.2%</text>
    </g>
    
    <!-- Funnel Bar 4: Deals Closed -->
    <g transform="translate(24, 310)">
      <text x="0" y="16" font-family="system-ui, sans-serif" font-size="12" fill="#9CA3AF">4. Closed-Won Deals (620)</text>
      <rect x="0" y="24" width="412" height="24" rx="4" fill="#374151"/>
      <rect x="0" y="24" width="25" height="24" rx="4" fill="#10B981"/>
      <text x="40" y="40" font-family="system-ui, sans-serif" font-weight="bold" font-size="11" fill="#10B981">6.2%</text>
    </g>
    
    <!-- Additional Stat row -->
    <line x1="24" y1="390" x2="436" y2="390" stroke="#374151" stroke-opacity="0.5"/>
    <text x="24" y="418" font-family="system-ui, sans-serif" font-size="13" fill="#9CA3AF">Global Conversion Efficiency Rating:</text>
    <text x="436" y="418" font-family="system-ui, sans-serif" font-weight="bold" font-size="15" fill="#10B981" text-anchor="end">A+ Excellent (+4.2%)</text>
  </g>
</svg>
