<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="800" height="450" fill="#0f172a"/>
  <!-- Interactive Content Calendar UI -->
  <rect x="20" y="20" width="760" height="410" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="40" y="55" font-family="system-ui" font-size="16" font-weight="bold" fill="#ffffff">📅 Drag-and-Drop Content Calendar (dnd-kit + FullCalendar)</text>

  <!-- Left Sidebar (Unscheduled Drafts) -->
  <rect x="40" y="80" width="180" height="320" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="55" y="105" font-family="system-ui" font-size="11" font-weight="bold" fill="#94a3b8">UNSCHEDULED DRAFTS</text>
  <rect x="50" y="120" width="160" height="45" rx="6" fill="#1e293b" stroke="#7C3AED"/>
  <text x="60" y="140" font-family="system-ui" font-size="9" fill="#ffffff">IG: Product Launch</text>
  <rect x="50" y="175" width="160" height="45" rx="6" fill="#1e293b" stroke="#2563EB"/>
  <text x="60" y="195" font-family="system-ui" font-size="9" fill="#ffffff">Blog: SaaS Guide</text>

  <!-- Calendar Month Grid -->
  <rect x="235" y="80" width="505" height="320" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="250" y="105" font-family="system-ui" font-size="13" font-weight="bold" fill="#ffffff">August 2026</text>
  
  <!-- Calendar Cells Grid -->
  <g transform="translate(250, 120)">
    <!-- Week Header -->
    <text x="10" y="10" font-family="system-ui" font-size="9" fill="#64748b">MON</text>
    <text x="75" y="10" font-family="system-ui" font-size="9" fill="#64748b">TUE</text>
    <text x="140" y="10" font-family="system-ui" font-size="9" fill="#64748b">WED</text>
    <text x="205" y="10" font-family="system-ui" font-size="9" fill="#64748b">THU</text>
    <text x="270" y="10" font-family="system-ui" font-size="9" fill="#64748b">FRI</text>

    <!-- Cells -->
    <rect x="0" y="20" width="60" height="70" rx="4" fill="#1e293b" stroke="#334155"/>
    <rect x="5" y="45" width="50" height="18" rx="3" fill="#7C3AED"/>
    <text x="10" y="57" font-family="system-ui" font-size="7" fill="#fff">IG Post</text>

    <rect x="65" y="20" width="60" height="70" rx="4" fill="#1e293b" stroke="#334155"/>
    <rect x="130" y="20" width="60" height="70" rx="4" fill="#1e293b" stroke="#334155"/>
    <rect x="135" y="45" width="50" height="18" rx="3" fill="#2563EB"/>
    <text x="140" y="57" font-family="system-ui" font-size="7" fill="#fff">Blog Draft</text>

    <rect x="195" y="20" width="60" height="70" rx="4" fill="#1e293b" stroke="#334155"/>
    <rect x="260" y="20" width="60" height="70" rx="4" fill="#1e293b" stroke="#334155"/>
    <rect x="265" y="45" width="50" height="18" rx="3" fill="#DB2777"/>
    <text x="270" y="57" font-family="system-ui" font-size="7" fill="#fff">Newsletter</text>
  </g>
</svg>
