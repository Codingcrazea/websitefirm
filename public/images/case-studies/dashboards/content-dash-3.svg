  <text x="75" y="170" font-family="system-ui" font-size="8" fill="#cbd5e1">"5 ways AI reduces customer friction..."</text>
  <rect x="75" y="205" width="60" height="18" rx="9" fill="#16A34A"/>
  <text x="105" y="217" font-family="system-ui" font-size="7" font-weight="bold" fill="#fff" text-anchor="middle">Published</text>

  <rect x="245" y="130" width="170" height="110" rx="6" fill="#1e293b" stroke="#2563EB"/>
  <text x="260" y="150" font-family="system-ui" font-size="10" font-weight="bold" fill="#60a5fa">Blog Draft</text>
  <text x="260" y="170" font-family="system-ui" font-size="8" fill="#cbd5e1">"The Ultimate Guide to Multi-Tenant SaaS..."</text>

  <!-- Right: Brand Voice Configuration -->
  <rect x="460" y="80" width="280" height="320" rx="8" fill="#0f172a" stroke="#334155"/>
