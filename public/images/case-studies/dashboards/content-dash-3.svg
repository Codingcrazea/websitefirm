  <text x="480" y="150" font-family="system-ui" font-size="9" fill="#e2e8f0">B2B SaaS Founders &amp; Marketers</text>

  <text x="480" y="175" font-family="system-ui" font-size="9" fill="#94a3b8">Tone Keywords:</text>
  <text x="480" y="190" font-family="system-ui" font-size="9" fill="#e2e8f0">Authoritative, Inspiring, Data-Backed</text>

  <text x="480" y="215" font-family="system-ui" font-size="9" fill="#94a3b8">Example Reference Posts:</text>
  <rect x="480" y="225" width="240" height="50" rx="4" fill="#1e293b" stroke="#334155"/>
  <text x="490" y="242" font-family="system-ui" font-size="8" fill="#cbd5e1">"Scale doesn't mean complexity..."</text>
