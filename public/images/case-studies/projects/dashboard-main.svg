<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.8"/>
    </linearGradient>
    
    <!-- Shadows & Filters -->
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#6366F1" flood-opacity="0.3"/>
    </filter>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="600" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Sidebar -->
  <rect x="0" y="0" width="220" height="600" rx="16" fill="#1F2937" fill-opacity="0.4"/>
  <line x1="220" y1="0" x2="220" y2="600" stroke="#374151" stroke-opacity="0.5"/>
  
  <!-- Logo -->
  <rect x="24" y="28" width="32" height="32" rx="8" fill="url(#accentGrad)"/>
  <text x="34" y="50" font-family="system-ui, sans-serif" font-weight="bold" font-size="18" fill="#FFF">Ω</text>
  <text x="68" y="50" font-family="system-ui, sans-serif" font-weight="bold" font-size="18" fill="#F3F4F6">AI-CRM</text>
  
  <!-- Sidebar Navigation Items -->
  <g transform="translate(0, 90)">
    <!-- Dashboard (Active) -->
    <rect x="12" y="0" width="196" height="38" rx="8" fill="#374151" fill-opacity="0.6"/>
    <rect x="12" y="9" width="4" height="20" rx="2" fill="#6366F1"/>
    <rect x="32" y="11" width="16" height="16" rx="4" fill="#6366F1"/>
    <text x="60" y="24" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#FFF">Dashboard</text>
    
    <!-- Contacts -->
    <rect x="32" y="51" width="16" height="16" rx="4" fill="#4B5563"/>
    <text x="60" y="64" font-family="system-ui, sans-serif" font-size="14" fill="#9CA3AF">Contacts</text>
    
    <!-- Pipelines -->
    <rect x="32" y="91" width="16" height="16" rx="4" fill="#4B5563"/>
    <text x="60" y="104" font-family="system-ui, sans-serif" font-size="14" fill="#9CA3AF">Pipelines</text>
    
    <!-- Org Structure -->
    <rect x="32" y="131" width="16" height="16" rx="4" fill="#4B5563"/>
    <text x="60" y="144" font-family="system-ui, sans-serif" font-size="14" fill="#9CA3AF">Organization</text>
    
    <!-- Audit Logs -->
    <rect x="32" y="171" width="16" height="16" rx="4" fill="#4B5563"/>
    <text x="60" y="184" font-family="system-ui, sans-serif" font-size="14" fill="#9CA3AF">Audit Logs</text>
    
    <!-- Settings -->
    <rect x="32" y="431" width="16" height="16" rx="4" fill="#4B5563"/>
    <text x="60" y="444" font-family="system-ui, sans-serif" font-size="14" fill="#9CA3AF">Settings</text>
  </g>
  
  <!-- Header -->
  <g transform="translate(220, 0)">
    <line x1="0" y1="70" x2="780" y2="70" stroke="#374151" stroke-opacity="0.5"/>
    <text x="40" y="43" font-family="system-ui, sans-serif" font-weight="bold" font-size="20" fill="#F3F4F6">Executive Overview</text>
    
    <!-- Tenant Selector -->
    <rect x="260" y="20" width="150" height="32" rx="6" fill="#1F2937" stroke="#374151" stroke-width="1"/>
    <circle cx="278" cy="36" r="6" fill="#10B981"/>
    <text x="294" y="41" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#E5E7EB">Acme Corp</text>
    
    <!-- Search Bar -->
    <rect x="430" y="20" width="200" height="32" rx="6" fill="#1F2937" stroke="#374151" stroke-width="1"/>
    <text x="445" y="41" font-family="system-ui, sans-serif" font-size="12" fill="#6B7280">Smart search (⌘K)...</text>
    
    <!-- User Profile & Status -->
    <rect x="700" y="18" width="34" height="34" rx="17" fill="url(#accentGrad)"/>
    <text x="711" y="40" font-family="system-ui, sans-serif" font-weight="bold" font-size="14" fill="#FFF">JD</text>
    <circle cx="730" cy="46" r="5" fill="#10B981" stroke="#111827" stroke-width="1.5"/>
  </g>
  
  <!-- Main Grid Area -->
  <g transform="translate(240, 90)">
    <!-- Metric Card 1 (Leads) -->
    <g transform="translate(20, 0)">
      <rect width="220" height="100" rx="12" fill="#1F2937" fill-opacity="0.6" stroke="#374151" stroke-width="1" filter="url(#shadow)"/>
      <text x="20" y="32" font-family="system-ui, sans-serif" font-size="14" font-weight="500" fill="#9CA3AF">Total Active Leads</text>
      <text x="20" y="68" font-family="system-ui, sans-serif" font-size="28" font-weight="bold" fill="#FFF">1,482</text>
      <rect x="150" y="48" width="50" height="20" rx="10" fill="#10B981" fill-opacity="0.2"/>
      <text x="158" y="62" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#10B981">+12.4%</text>
    </g>
    
    <!-- Metric Card 2 (Pipeline) -->
    <g transform="translate(260, 0)">
      <rect width="220" height="100" rx="12" fill="#1F2937" fill-opacity="0.6" stroke="#374151" stroke-width="1" filter="url(#shadow)"/>
      <text x="20" y="32" font-family="system-ui, sans-serif" font-size="14" font-weight="500" fill="#9CA3AF">Pipeline Value</text>
      <text x="20" y="68" font-family="system-ui, sans-serif" font-size="28" font-weight="bold" fill="#FFF">$452.8K</text>
      <rect x="150" y="48" width="50" height="20" rx="10" fill="#10B981" fill-opacity="0.2"/>
      <text x="158" y="62" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#10B981">+8.1%</text>
    </g>
    
    <!-- Metric Card 3 (AI Score) -->
    <g transform="translate(500, 0)">
      <rect width="220" height="100" rx="12" fill="#1F2937" fill-opacity="0.6" stroke="#374151" stroke-width="1" filter="url(#shadow)"/>
      <text x="20" y="32" font-family="system-ui, sans-serif" font-size="14" font-weight="500" fill="#9CA3AF">Avg Lead AI Score</text>
      <text x="20" y="68" font-family="system-ui, sans-serif" font-size="28" font-weight="bold" fill="url(#accentGrad)">84.2</text>
      <rect x="150" y="48" width="50" height="20" rx="10" fill="#8B5CF6" fill-opacity="0.2"/>
      <text x="162" y="62" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#A78BFA">Optimal</text>
    </g>
    
    <!-- Main Chart Section -->
    <g transform="translate(20, 120)">
      <rect width="460" height="340" rx="12" fill="#1F2937" fill-opacity="0.6" stroke="#374151" stroke-width="1"/>
      <text x="20" y="30" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#FFF">Lead Conversion Trend (Monthly)</text>
      
      <!-- Chart Y-axis grid -->
      <line x1="40" y1="80" x2="430" y2="80" stroke="#374151" stroke-opacity="0.3"/>
      <line x1="40" y1="140" x2="430" y2="140" stroke="#374151" stroke-opacity="0.3"/>
      <line x1="40" y1="200" x2="430" y2="200" stroke="#374151" stroke-opacity="0.3"/>
      <line x1="40" y1="260" x2="430" y2="260" stroke="#374151" stroke-opacity="0.3"/>
      
      <!-- Chart Area Graph -->
      <path d="M 60 260 L 120 220 L 180 180 L 240 140 L 300 110 L 360 90 L 420 70 L 420 280 L 60 280 Z" fill="url(#chartGrad)"/>
      <path d="M 60 260 L 120 220 L 180 180 L 240 140 L 300 110 L 360 90 L 420 70" fill="none" stroke="#8B5CF6" stroke-width="3" filter="url(#glow)"/>
      
      <!-- Chart Dots -->
      <circle cx="60" cy="260" r="4" fill="#FFF" stroke="#8B5CF6" stroke-width="2"/>
      <circle cx="120" cy="220" r="4" fill="#FFF" stroke="#8B5CF6" stroke-width="2"/>
      <circle cx="180" cy="180" r="4" fill="#FFF" stroke="#8B5CF6" stroke-width="2"/>
      <circle cx="240" cy="140" r="4" fill="#FFF" stroke="#8B5CF6" stroke-width="2"/>
      <circle cx="300" cy="110" r="4" fill="#FFF" stroke="#8B5CF6" stroke-width="2"/>
      <circle cx="360" cy="90" r="4" fill="#FFF" stroke="#8B5CF6" stroke-width="2"/>
      <circle cx="420" cy="70" r="4" fill="#FFF" stroke="#8B5CF6" stroke-width="2"/>
      
      <!-- Labels -->
      <text x="60" y="300" font-family="system-ui, sans-serif" font-size="10" fill="#9CA3AF" text-anchor="middle">Jan</text>
      <text x="120" y="300" font-family="system-ui, sans-serif" font-size="10" fill="#9CA3AF" text-anchor="middle">Feb</text>
      <text x="180" y="300" font-family="system-ui, sans-serif" font-size="10" fill="#9CA3AF" text-anchor="middle">Mar</text>
      <text x="240" y="300" font-family="system-ui, sans-serif" font-size="10" fill="#9CA3AF" text-anchor="middle">Apr</text>
      <text x="300" y="300" font-family="system-ui, sans-serif" font-size="10" fill="#9CA3AF" text-anchor="middle">May</text>
      <text x="360" y="300" font-family="system-ui, sans-serif" font-size="10" fill="#9CA3AF" text-anchor="middle">Jun</text>
      <text x="420" y="300" font-family="system-ui, sans-serif" font-size="10" fill="#9CA3AF" text-anchor="middle">Jul</text>
    </g>
    
    <!-- Top Leads Panel -->
    <g transform="translate(500, 120)">
      <rect width="220" height="340" rx="12" fill="#1F2937" fill-opacity="0.6" stroke="#374151" stroke-width="1"/>
      <text x="16" y="30" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" fill="#FFF">High Priority Leads</text>
      
      <!-- Lead List Items -->
      <g transform="translate(16, 50)">
        <!-- Item 1 -->
        <circle cx="16" cy="18" r="14" fill="#3B82F6"/>
        <text x="16" y="22" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#FFF" text-anchor="middle">AC</text>
        <text x="40" y="16" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#FFF">Apple Corp</text>
        <text x="40" y="29" font-family="system-ui, sans-serif" font-size="10" fill="#9CA3AF">AI Score: 96</text>
        <rect x="145" y="10" width="40" height="16" rx="8" fill="#10B981" fill-opacity="0.2"/>
        <text x="165" y="22" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#10B981" text-anchor="middle">Hot</text>
        <line x1="0" y1="40" x2="190" y2="40" stroke="#374151" stroke-opacity="0.3"/>
      </g>
      
      <g transform="translate(16, 100)">
        <!-- Item 2 -->
        <circle cx="16" cy="18" r="14" fill="#10B981"/>
        <text x="16" y="22" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#FFF" text-anchor="middle">MS</text>
        <text x="40" y="16" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#FFF">MicroSoft</text>
        <text x="40" y="29" font-family="system-ui, sans-serif" font-size="10" fill="#9CA3AF">AI Score: 92</text>
        <rect x="145" y="10" width="40" height="16" rx="8" fill="#10B981" fill-opacity="0.2"/>
        <text x="165" y="22" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#10B981" text-anchor="middle">Hot</text>
        <line x1="0" y1="40" x2="190" y2="40" stroke="#374151" stroke-opacity="0.3"/>
      </g>

      <g transform="translate(16, 150)">
        <!-- Item 3 -->
        <circle cx="16" cy="18" r="14" fill="#8B5CF6"/>
        <text x="16" y="22" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#FFF" text-anchor="middle">SF</text>
        <text x="40" y="16" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#FFF">SalesForce</text>
        <text x="40" y="29" font-family="system-ui, sans-serif" font-size="10" fill="#9CA3AF">AI Score: 87</text>
        <rect x="145" y="10" width="40" height="16" rx="8" fill="#EAB308" fill-opacity="0.2"/>
        <text x="165" y="22" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#EAB308" text-anchor="middle">Warm</text>
        <line x1="0" y1="40" x2="190" y2="40" stroke="#374151" stroke-opacity="0.3"/>
      </g>
      
      <g transform="translate(16, 200)">
        <!-- Item 4 -->
        <circle cx="16" cy="18" r="14" fill="#F59E0B"/>
        <text x="16" y="22" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#FFF" text-anchor="middle">GO</text>
        <text x="40" y="16" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#FFF">Google Inc</text>
        <text x="40" y="29" font-family="system-ui, sans-serif" font-size="10" fill="#9CA3AF">AI Score: 81</text>
        <rect x="145" y="10" width="40" height="16" rx="8" fill="#EAB308" fill-opacity="0.2"/>
        <text x="165" y="22" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#EAB308" text-anchor="middle">Warm</text>
        <line x1="0" y1="40" x2="190" y2="40" stroke="#374151" stroke-opacity="0.3"/>
      </g>
    </g>
  </g>
</svg>
