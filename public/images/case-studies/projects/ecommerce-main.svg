<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)"/>

  <!-- Top Nav Bar Mockup -->
  <rect x="20" y="20" width="760" height="50" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <circle cx="50" cy="45" r="8" fill="#10b981"/>
  <rect x="70" y="38" width="140" height="14" rx="4" fill="#334155"/>
  <rect x="650" y="35" width="100" height="20" rx="6" fill="#10b981"/>
  <text x="700" y="49" font-family="system-ui" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">Shopify Sync</text>

  <!-- Metric Cards Row -->
  <!-- Card 1 -->
  <g transform="translate(20, 85)" filter="url(#shadow)">
    <rect width="180" height="90" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="20" y="30" font-family="system-ui" font-size="11" fill="#94a3b8">Total Revenue</text>
    <text x="20" y="58" font-family="system-ui" font-size="22" font-weight="bold" fill="#ffffff">$128,450.00</text>
    <text x="20" y="76" font-family="system-ui" font-size="10" fill="#10b981">↑ +18.4% vs last mo</text>
  </g>
  <!-- Card 2 -->
  <g transform="translate(213, 85)" filter="url(#shadow)">
    <rect width="180" height="90" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="20" y="30" font-family="system-ui" font-size="11" fill="#94a3b8">Total Orders</text>
    <text x="20" y="58" font-family="system-ui" font-size="22" font-weight="bold" fill="#ffffff">3,420</text>
    <text x="20" y="76" font-family="system-ui" font-size="10" fill="#10b981">↑ +12.1% across 4 channels</text>
  </g>
  <!-- Card 3 -->
  <g transform="translate(406, 85)" filter="url(#shadow)">
    <rect width="180" height="90" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="20" y="30" font-family="system-ui" font-size="11" fill="#94a3b8">Avg Order Value</text>
    <text x="20" y="58" font-family="system-ui" font-size="22" font-weight="bold" fill="#ffffff">$37.55</text>
    <text x="20" y="76" font-family="system-ui" font-size="10" fill="#38bdf8">→ Steady margin</text>
  </g>
  <!-- Card 4 -->
  <g transform="translate(600, 85)" filter="url(#shadow)">
    <rect width="180" height="90" rx="10" fill="#1e293b" stroke="#ef4444" stroke-opacity="0.5" stroke-width="1"/>
    <text x="20" y="30" font-family="system-ui" font-size="11" fill="#f87171">Low Stock Alerts</text>
    <text x="20" y="58" font-family="system-ui" font-size="22" font-weight="bold" fill="#ef4444">4 SKUs</text>
    <text x="20" y="76" font-family="system-ui" font-size="10" fill="#f87171">⚠️ Action needed</text>
  </g>

  <!-- Large Revenue Line Chart -->
  <g transform="translate(20, 190)" filter="url(#shadow)">
    <rect width="470" height="240" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="20" y="30" font-family="system-ui" font-size="13" font-weight="bold" fill="#ffffff">Revenue Over Time</text>
    <rect x="360" y="16" width="90" height="20" rx="4" fill="#0f172a"/>
    <text x="405" y="30" font-family="system-ui" font-size="9" fill="#94a3b8" text-anchor="middle">30 Days</text>
    
    <!-- Grid lines -->
    <line x1="20" y1="70" x2="450" y2="70" stroke="#334155" stroke-dasharray="3"/>
    <line x1="20" y1="120" x2="450" y2="120" stroke="#334155" stroke-dasharray="3"/>
    <line x1="20" y1="170" x2="450" y2="170" stroke="#334155" stroke-dasharray="3"/>

    <!-- Chart Fill & Line -->
    <path d="M 30 180 Q 90 120, 140 140 T 260 90 T 360 110 T 440 60 L 440 210 L 30 210 Z" fill="url(#lineGrad)"/>
    <path d="M 30 180 Q 90 120, 140 140 T 260 90 T 360 110 T 440 60" fill="none" stroke="#10b981" stroke-width="3"/>
    <circle cx="440" cy="60" r="5" fill="#10b981" stroke="#ffffff" stroke-width="2"/>
  </g>

  <!-- Multi-Channel Revenue Distribution Donut -->
  <g transform="translate(505, 190)" filter="url(#shadow)">
    <rect width="275" height="240" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="20" y="30" font-family="system-ui" font-size="13" font-weight="bold" fill="#ffffff">Revenue by Channel</text>
    
    <!-- Donut Segments Mockup -->
    <circle cx="137" cy="125" r="55" fill="none" stroke="#95BF47" stroke-width="22" stroke-dasharray="140 200"/>
    <circle cx="137" cy="125" r="55" fill="none" stroke="#FF9900" stroke-width="22" stroke-dasharray="90 250" stroke-dashoffset="-140"/>
    <circle cx="137" cy="125" r="55" fill="none" stroke="#E1306C" stroke-width="22" stroke-dasharray="60 280" stroke-dashoffset="-230"/>
    <circle cx="137" cy="125" r="55" fill="none" stroke="#6B7280" stroke-width="22" stroke-dasharray="40 300" stroke-dashoffset="-290"/>

    <!-- Channel Legends -->
    <rect x="25" y="195" width="10" height="10" rx="2" fill="#95BF47"/>
    <text x="40" y="204" font-family="system-ui" font-size="10" fill="#cbd5e1">Shopify (45%)</text>
    
    <rect x="145" y="195" width="10" height="10" rx="2" fill="#FF9900"/>
    <text x="160" y="204" font-family="system-ui" font-size="10" fill="#cbd5e1">Amazon (30%)</text>

    <rect x="25" y="215" width="10" height="10" rx="2" fill="#E1306C"/>
    <text x="40" y="224" font-family="system-ui" font-size="10" fill="#cbd5e1">Instagram (15%)</text>

    <rect x="145" y="215" width="10" height="10" rx="2" fill="#6B7280"/>
    <text x="160" y="224" font-family="system-ui" font-size="10" fill="#cbd5e1">Offline (10%)</text>
  </g>
</svg>
