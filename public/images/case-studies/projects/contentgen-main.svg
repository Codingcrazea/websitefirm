<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="violetGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <filter id="shadow5" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad5)"/>

  <!-- Top App Header -->
  <rect x="20" y="20" width="760" height="50" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <circle cx="50" cy="45" r="8" fill="#7C3AED"/>
  <text x="70" y="49" font-family="system-ui" font-size="14" font-weight="bold" fill="#ffffff">✨ ContentCraft AI Studio</text>
  <rect x="630" y="33" width="130" height="24" rx="12" fill="url(#violetGrad)"/>
  <text x="695" y="49" font-family="system-ui" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">✨ Generate Content</text>

  <!-- Left Input Prompt Panel -->
  <g transform="translate(20, 85)" filter="url(#shadow5)">
    <rect width="250" height="340" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="20" y="30" font-family="system-ui" font-size="12" font-weight="bold" fill="#c084fc">1. Content Prompt</text>
    <rect x="20" y="42" width="210" height="70" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="30" y="62" font-family="system-ui" font-size="10" fill="#cbd5e1">"Announce our new AI-powered</text>
    <text x="30" y="78" font-family="system-ui" font-size="10" fill="#cbd5e1">multi-tenant CRM launch with</text>
    <text x="30" y="94" font-family="system-ui" font-size="10" fill="#cbd5e1">special 20% discount..."</text>

    <text x="20" y="132" font-family="system-ui" font-size="11" font-weight="bold" fill="#94a3b8">Content Format</text>
    <rect x="20" y="142" width="65" height="22" rx="4" fill="#7C3AED"/>
    <text x="52" y="156" font-family="system-ui" font-size="9" fill="#ffffff" text-anchor="middle">Social</text>
    <rect x="92" y="142" width="65" height="22" rx="4" fill="#0f172a" stroke="#334155"/>
    <text x="124" y="156" font-family="system-ui" font-size="9" fill="#94a3b8" text-anchor="middle">Blog</text>
    <rect x="164" y="142" width="65" height="22" rx="4" fill="#0f172a" stroke="#334155"/>
    <text x="196" y="156" font-family="system-ui" font-size="9" fill="#94a3b8" text-anchor="middle">Email</text>

    <text x="20" y="184" font-family="system-ui" font-size="11" font-weight="bold" fill="#94a3b8">Platform</text>
    <rect x="20" y="194" width="100" height="22" rx="4" fill="#7C3AED"/>
    <text x="70" y="208" font-family="system-ui" font-size="9" fill="#ffffff" text-anchor="middle">LinkedIn</text>
    <rect x="130" y="194" width="100" height="22" rx="4" fill="#0f172a" stroke="#334155"/>
    <text x="180" y="208" font-family="system-ui" font-size="9" fill="#94a3b8" text-anchor="middle">Instagram</text>

    <text x="20" y="236" font-family="system-ui" font-size="11" font-weight="bold" fill="#94a3b8">Tone</text>
    <rect x="20" y="246" width="210" height="24" rx="4" fill="#0f172a" stroke="#334155"/>
    <text x="30" y="262" font-family="system-ui" font-size="10" fill="#e9d5ff">Professional &amp; Authoritative</text>

    <rect x="20" y="285" width="210" height="35" rx="8" fill="url(#violetGrad)"/>
    <text x="125" y="307" font-family="system-ui" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">✨ Generate 3 Variations</text>
  </g>

  <!-- Right Side: 3 Variation Preview Cards -->
  <!-- Variation 1 (LinkedIn) -->
  <g transform="translate(285, 85)" filter="url(#shadow5)">
    <rect width="155" height="340" rx="10" fill="#1e293b" stroke="#7C3AED" stroke-width="1.5"/>
    <rect x="10" y="10" width="135" height="20" rx="4" fill="#7C3AED" fill-opacity="0.2"/>
    <text x="15" y="24" font-family="system-ui" font-size="9" font-weight="bold" fill="#c084fc">Variation 1 (Professional)</text>
    
    <circle cx="24" cy="48" r="8" fill="#38bdf8"/>
    <rect x="36" y="44" width="70" height="8" rx="2" fill="#e2e8f0"/>
    
    <text x="12" y="70" font-family="system-ui" font-size="8" fill="#cbd5e1">🚀 Excited to announce</text>
    <text x="12" y="82" font-family="system-ui" font-size="8" fill="#cbd5e1">the launch of our enterprise</text>
    <text x="12" y="94" font-family="system-ui" font-size="8" fill="#cbd5e1">AI-CRM platform!</text>
    <text x="12" y="112" font-family="system-ui" font-size="8" fill="#818cf8">#SaaS #AI #CRM</text>

    <rect x="10" y="295" width="135" height="25" rx="5" fill="#7C3AED"/>
    <text x="77" y="311" font-family="system-ui" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle">Save as Draft</text>
  </g>

  <!-- Variation 2 (Instagram) -->
  <g transform="translate(450, 85)" filter="url(#shadow5)">
    <rect width="155" height="340" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <rect x="10" y="10" width="135" height="20" rx="4" fill="#0f172a"/>
    <text x="15" y="24" font-family="system-ui" font-size="9" font-weight="bold" fill="#94a3b8">Variation 2 (Witty)</text>
    
    <rect x="10" y="40" width="135" height="90" rx="6" fill="#334155"/>
    <text x="77" y="90" font-family="system-ui" font-size="20" fill="#94a3b8" text-anchor="middle">📸</text>

    <text x="12" y="148" font-family="system-ui" font-size="8" fill="#cbd5e1">Say goodbye to scattered</text>
    <text x="12" y="160" font-family="system-ui" font-size="8" fill="#cbd5e1">spreadsheets. Meet AI-CRM.</text>

    <rect x="10" y="295" width="135" height="25" rx="5" fill="#0f172a" stroke="#334155"/>
    <text x="77" y="311" font-family="system-ui" font-size="9" fill="#cbd5e1" text-anchor="middle">Save as Draft</text>
  </g>

  <!-- Variation 3 (Email/Blog) -->
  <g transform="translate(615, 85)" filter="url(#shadow5)">
    <rect width="155" height="340" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <rect x="10" y="10" width="135" height="20" rx="4" fill="#0f172a"/>
    <text x="15" y="24" font-family="system-ui" font-size="9" font-weight="bold" fill="#94a3b8">Variation 3 (Casual)</text>
    
    <text x="12" y="48" font-family="system-ui" font-size="8" font-weight="bold" fill="#ffffff">Subj: Big news inside 🎉</text>
    <text x="12" y="66" font-family="system-ui" font-size="8" fill="#cbd5e1">Hey team, we've been</text>
    <text x="12" y="78" font-family="system-ui" font-size="8" fill="#cbd5e1">working on something new...</text>

    <rect x="10" y="295" width="135" height="25" rx="5" fill="#0f172a" stroke="#334155"/>
    <text x="77" y="311" font-family="system-ui" font-size="9" fill="#cbd5e1" text-anchor="middle">Save as Draft</text>
  </g>
</svg>
